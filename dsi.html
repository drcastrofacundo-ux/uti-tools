<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSI — UTI Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0f1e; --surface:rgba(255,255,255,0.04); --surface-hover:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.10); --text:#fff; --sub:rgba(255,255,255,0.55); --muted:rgba(255,255,255,0.35);
      --input-bg:#0f1729; --accent:#4a6cf7;
      --green:#1D9E75; --ga:rgba(29,158,117,0.15); --gb:rgba(29,158,117,0.30);
      --yellow:#EF9F27; --ya:rgba(239,159,39,0.15); --yb:rgba(239,159,39,0.30);
      --red:#e05555; --ra:rgba(224,85,85,0.15); --rb:rgba(224,85,85,0.30);
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .ecg-bg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: visible; }
    .page { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding: 28px 18px 60px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600;
      color: var(--sub); text-decoration: none; background: var(--surface); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; transition: background 0.2s, color 0.2s; margin-bottom: 22px;
    }
    .back-btn:hover { background: var(--surface-hover); color: var(--text); }

    .header { margin-bottom: 26px; }
    h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; }
    .header p { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }

    label {
      display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--sub); margin-bottom: 7px;
    }
    .field { margin-bottom: 16px; }
    input[type="number"] {
      width: 100%; padding: 13px 14px; font-size: 1.2rem; font-weight: 600;
      color: var(--text); background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; outline: none; transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus { border-color: rgba(255,255,255,0.3); background: #131e38; }
    input::placeholder { color: rgba(255,255,255,0.18); font-weight: 400; }

    .formula-note { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 14px 0 20px; font-style: italic; }

    .result-box {
      border-radius: 12px; padding: 24px 18px; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s; min-height: 110px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .result-box.green  { background: var(--ga); border-color: var(--gb); }
    .result-box.yellow { background: var(--ya); border-color: var(--yb); }
    .result-box.red    { background: var(--ra); border-color: var(--rb); }

    .result-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 7px; }
    .result-value { font-size: 3rem; font-weight: 800; color: rgba(255,255,255,0.2); letter-spacing: -1px; line-height: 1; transition: color 0.3s; }
    .result-value.green  { color: var(--green); }
    .result-value.yellow { color: var(--yellow); }
    .result-value.red    { color: var(--red); }
    .result-interp { margin-top: 8px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
    .result-interp.green  { color: var(--green); }
    .result-interp.yellow { color: var(--yellow); }
    .result-interp.red    { color: var(--red); }

    /* Zones strip */
    .zones { display: flex; gap: 0; margin-top: 14px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .zone { flex: 1; padding: 8px 4px; text-align: center; font-size: 0.68rem; font-weight: 700; }
    .zone .zone-val { font-size: 0.78rem; display: block; margin-bottom: 2px; }
    .zone.green  { background: var(--ga); color: var(--green); }
    .zone.yellow { background: var(--ya); color: var(--yellow); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .zone.red    { background: var(--ra); color: var(--red); }

    /* Fisiopatología */
    .fisio-wrap { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: none; }
    .fisio-wrap.visible { display: block; }
    .fisio-wrap.green  { border-color: var(--gb); }
    .fisio-wrap.yellow { border-color: var(--yb); }
    .fisio-wrap.red    { border-color: var(--rb); }
    .fisio-toggle {
      width: 100%; padding: 11px 14px; background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--sub); transition: background 0.2s;
    }
    .fisio-toggle:hover { background: var(--surface-hover); }
    .fisio-toggle.green  { color: var(--green); }
    .fisio-toggle.yellow { color: var(--yellow); }
    .fisio-toggle.red    { color: var(--red); }
    .fisio-arrow { font-size: 0.65rem; color: var(--muted); transition: transform 0.25s; }
    .fisio-arrow.open { transform: rotate(180deg); }
    .fisio-body { display: none; padding: 0 14px 14px; background: rgba(255,255,255,0.02); }
    .fisio-body.open { display: block; }
    .fisio-body p { font-size: 0.84rem; line-height: 1.65; color: rgba(255,255,255,0.7); margin-bottom: 9px; }
    .fisio-body p:last-child { margin-bottom: 0; }
    .fisio-body strong { color: var(--text); }
    .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 6px; margin-bottom: 9px; }
    .tag.green  { background: var(--ga); color: var(--green); border: 1px solid var(--gb); }
    .tag.yellow { background: var(--ya); color: var(--yellow); border: 1px solid var(--yb); }
    .tag.red    { background: var(--ra); color: var(--red); border: 1px solid var(--rb); }
    .divider { height: 1px; background: var(--border); margin: 9px 0; }

    .clear-btn {
      width: 100%; margin-top: 16px; padding: 12px; background: none;
      border: 1px solid var(--border); border-radius: 8px; font-size: 0.86rem;
      font-weight: 600; color: var(--muted); cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .clear-btn:hover { background: var(--surface-hover); color: var(--sub); }
  </style>
</head>
<body>
  <svg class="ecg-bg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="page">
    <a class="back-btn" href="index.html">← Inicio</a>
    <div class="header">
      <h1>Diastolic Shock Index</h1>
      <p>Índice de Shock Diastólico · FC ÷ PAD</p>
    </div>

    <div class="field">
      <label>FC — Frecuencia Cardíaca (lpm)</label>
      <input type="number" id="fc" placeholder="ej. 110" inputmode="decimal" min="0" max="300" autocomplete="off">
    </div>
    <div class="field">
      <label>PAD — Presión Arterial Diastólica (mmHg)</label>
      <input type="number" id="pad" placeholder="ej. 50" inputmode="decimal" min="0" max="200" autocomplete="off">
    </div>
    <p class="formula-note">DSI = FC ÷ PAD</p>

    <div class="result-box" id="resultBox">
      <div class="result-label">Resultado DSI</div>
      <div class="result-value" id="resultValue">—</div>
      <div class="result-interp" id="resultInterp">Ingresá los valores</div>
    </div>

    <div class="zones">
      <div class="zone green"><span class="zone-val">&lt; 2.0</span>Normal</div>
      <div class="zone yellow"><span class="zone-val">2.0 – 2.5</span>Moderado</div>
      <div class="zone red"><span class="zone-val">&gt; 2.5</span>Severo</div>
    </div>

    <div class="fisio-wrap" id="fisioWrap">
      <button class="fisio-toggle" id="fisioToggle" onclick="toggleFisio()">
        <span>Ver fisiopatología y conducta</span>
        <span class="fisio-arrow" id="fisioArrow">▼</span>
      </button>
      <div class="fisio-body" id="fisioBody"></div>
    </div>

    <button class="clear-btn" onclick="clearAll()">Limpiar</button>
  </div>

  <script>
    const FISIO = {
      green:`<span class="tag green">DSI &lt; 2.0 — Compensado</span>
<p><strong>Efecto Windkessel preservado.</strong> La aorta y los grandes vasos actúan como reservorio elástico: almacenan energía en sístole y la liberan en diástole, manteniendo la PAD. El tono arteriolar conservado sostiene la RVP y garantiza la perfusión diastólica.</p>
<div class="divider"></div>
<p><strong>Conducta:</strong> Taquicardia proporcional al estímulo (fiebre, dolor, hipovolemia leve). Sin evidencia hemodinámica de colapso vasomotor. Evaluar y tratar la causa. Monitoreo habitual.</p>`,
      yellow:`<span class="tag yellow">DSI 2.0–2.5 — Riesgo moderado</span>
<p><strong>Pérdida parcial del tono vasomotor.</strong> La vasodilatación sistémica reduce la RVP y la PAD. El efecto Windkessel se deteriora: la aorta no puede sostener la presión diastólica efectiva, acortando el tiempo de llenado coronario.</p>
<div class="divider"></div>
<p><strong>Taquicardia compensadora.</strong> El simpático aumenta la FC para mantener el GC. Esto eleva el numerador del DSI mientras la PAD cae — doble mecanismo que explica el ascenso del índice. La taquicardia sostenida acorta la diástole y reduce la perfusión subendocárdica.</p>
<div class="divider"></div>
<p><strong>Conducta:</strong> Zona de transición. Evaluar necesidad de vasopresores y carga de volumen. La PAD baja con FC alta es marcador de mal pronóstico independiente de la PAS.</p>`,
      red:`<span class="tag red">DSI &gt; 2.5 — Shock severo</span>
<p><strong>Colapso vasomotor.</strong> Pérdida profunda del tono arteriolar colapsa la RVP. La PAD cae críticamente porque no hay resistencia que sostenga la presión durante la diástole. El efecto Windkessel está abolido.</p>
<div class="divider"></div>
<p><strong>Caída de la PPC.</strong> PPC ≈ PAD − PCP (presión de cuña pulmonar). Con PAD muy baja la presión de perfusión coronaria colapsa incluso con PCP normal. El subendocardio —zona de mayor demanda y menor perfusión— entra en isquemia funcional, agravando la disfunción miocárdica.</p>
<div class="divider"></div>
<p><strong>Por qué la NE sola puede fallar.</strong> En vasoplejía profunda, incrementar la poscarga sin soporte inotrópico reduce el volumen sistólico si hay miocardiopatía séptica. Considerar <strong>vasopresina</strong> (receptor V1, ahorro de NE) y <strong>dobutamina o levosimendan</strong> si hay componente cardiogénico.</p>`
    };

    const fcInput=document.getElementById('fc'), padInput=document.getElementById('pad');
    const box=document.getElementById('resultBox'), valEl=document.getElementById('resultValue'), interpEl=document.getElementById('resultInterp');
    const fisioWrap=document.getElementById('fisioWrap'), fisioToggle=document.getElementById('fisioToggle');
    const fisioArrow=document.getElementById('fisioArrow'), fisioBody=document.getElementById('fisioBody');
    let fisioOpen=false, currentColor='';

    function toggleFisio(){
      fisioOpen=!fisioOpen;
      fisioBody.classList.toggle('open',fisioOpen);
      fisioArrow.classList.toggle('open',fisioOpen);
    }
    function updateFisio(color){
      if(color===currentColor) return;
      currentColor=color; fisioOpen=false;
      fisioBody.classList.remove('open'); fisioArrow.classList.remove('open');
      ['green','yellow','red'].forEach(c=>{fisioWrap.classList.remove(c);fisioToggle.classList.remove(c);});
      if(color){fisioWrap.classList.add('visible',color);fisioToggle.classList.add(color);fisioBody.innerHTML=FISIO[color];}
      else{fisioWrap.classList.remove('visible');fisioBody.innerHTML='';}
    }
    function setResult(value,color,interp){
      ['green','yellow','red'].forEach(c=>{box.classList.remove(c);valEl.classList.remove(c);interpEl.classList.remove(c);});
      valEl.textContent=value!==null?value:'—';
      interpEl.textContent=interp;
      if(color){box.classList.add(color);valEl.classList.add(color);interpEl.classList.add(color);}
    }
    function calculate(){
      const fc=parseFloat(fcInput.value), pad=parseFloat(padInput.value);
      if(!fcInput.value||!padInput.value||isNaN(fc)||isNaN(pad)){reset();return;}
      if(pad===0){setResult(null,'','PAD no puede ser 0');updateFisio('');return;}
      if(fc<=0||pad<=0){reset();return;}
      const dsi=fc/pad;
      if(dsi<2.0){setResult(dsi.toFixed(2),'green','Sin shock aparente');updateFisio('green');}
      else if(dsi<=2.5){setResult(dsi.toFixed(2),'yellow','Riesgo moderado');updateFisio('yellow');}
      else{setResult(dsi.toFixed(2),'red','Shock severo');updateFisio('red');}
    }
    function reset(){setResult(null,'','Ingresá los valores');updateFisio('');}
    function clearAll(){fcInput.value='';padInput.value='';reset();fcInput.focus();}
    fcInput.addEventListener('input',calculate);
    padInput.addEventListener('input',calculate);

    (function(){
      const svg=document.querySelector('.ecg-bg');
      const W=window.innerWidth,H=window.innerHeight;
      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      const BW=240,n=Math.ceil(W/BW)+2;
      function line(y,s,o,w){
        let d=`M${-BW},${y}`;
        for(let i=0;i<n;i++){const x=i*BW-BW;
          d+=` H${x+28} L${x+31},${y-3} L${x+36},${y-4} L${x+40},${y} H${x+56} L${x+59},${y+4} L${x+63},${y-38} L${x+68},${y+12} L${x+72},${y} H${x+78} L${x+83},${y-2} L${x+96},${y-9} L${x+110},${y} H${x+BW}`;}
        return `<path d="${d}" stroke="${s}" stroke-width="${w}" fill="none" opacity="${o}" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      svg.innerHTML=[line(H*.22,'#e05555',0.35,1.5),line(H*.52,'#e05555',0.18,1.2),line(H*.76,'#378ADD',0.12,1.2)].join('');
    })();
  </script>
</body>
</html>
